{{ $author := .author }}
{{ $image := .image }}

{{ if $image }}
  {{/* We bump the resize from Wowchemy's default 270x270 up to 600x600 */}}
  {{ $avatar := $image.Fill "600x600 Center webp" }}
  <img 
    class="avatar {{ if eq site.Params.avatar.shape "circle" }}circle{{ end }}" 
    src="{{ $avatar.RelPermalink }}" 
    width="{{ $avatar.Width }}" 
    height="{{ $avatar.Height }}" 
    alt="{{ $author }}"
    loading="lazy"
  >
{{ end }}
